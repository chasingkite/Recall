<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!-- Axes -->
  <line x1="20" y1="80" x2="180" y2="80" stroke="#374151" stroke-width="1.5"/>
  <line x1="100" y1="10" x2="100" y2="150" stroke="#374151" stroke-width="1.5"/>
  <!-- |x| dashed -->
  <polyline points="40,140 100,80 160,140" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- h shift right: |x-3| -->
  <polyline points="70,140 130,80 190,140" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrow showing horizontal shift -->
  <line x1="100" y1="83" x2="127" y2="83" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker></defs>
  <text x="105" y="96" font-size="8" fill="#ef4444" font-family="sans-serif">h = 3 →</text>
  <!-- Labels -->
  <text x="30" y="138" font-size="9" fill="#9ca3af" font-family="sans-serif">|x|</text>
  <text x="145" y="75" font-size="9" fill="#3b82f6" font-family="sans-serif">|x - 3|</text>
  <text x="60" y="15" font-size="10" fill="#374151" font-weight="bold" font-family="sans-serif">Horizontal Shift (h)</text>
</svg>
