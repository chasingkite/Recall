<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fff"/>
  <!-- Grid -->
  <g stroke="#e5e7eb" stroke-width="0.5">
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/><line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/><line x1="350" y1="0" x2="350" y2="300"/>
  </g>
  <!-- Axes -->
  <line x1="200" y1="0" x2="200" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="390" y="145" font-size="12" fill="#6b7280">x</text>
  <text x="205" y="12" font-size="12" fill="#6b7280">y</text>
  <!-- Center -->
  <circle cx="200" cy="150" r="4" fill="#ef4444"/>
  <!-- Original triangle (blue) - large -->
  <polygon points="100,50 350,50 350,250" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="48" font-size="10" fill="#3b82f6">A(-2,2)</text>
  <text x="352" y="48" font-size="10" fill="#3b82f6">B(3,2)</text>
  <text x="352" y="260" font-size="10" fill="#3b82f6">C(3,-2)</text>
  <!-- Dilated triangle k=1/2 (orange) - smaller -->
  <polygon points="150,100 275,100 275,200" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="2"/>
  <text x="128" y="98" font-size="10" fill="#ea580c">A'(-1,1)</text>
  <text x="278" y="98" font-size="10" fill="#ea580c">B'(1.5,1)</text>
  <text x="278" y="210" font-size="10" fill="#ea580c">C'(1.5,-1)</text>
  <!-- Rays -->
  <line x1="200" y1="150" x2="100" y2="50" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="200" y1="150" x2="350" y2="50" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="200" y1="150" x2="350" y2="250" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
  <!-- Labels -->
  <text x="200" y="285" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Dilation with k = ½ (Reduction)</text>
  <text x="200" y="270" font-size="11" fill="#6b7280" text-anchor="middle">(x, y) → (½x, ½y)</text>
  <!-- Legend -->
  <rect x="10" y="10" width="12" height="12" fill="#3b82f6" rx="2"/>
  <text x="26" y="20" font-size="10" fill="#3b82f6">Original</text>
  <rect x="10" y="26" width="12" height="12" fill="#f97316" rx="2"/>
  <text x="26" y="36" font-size="10" fill="#f97316">Image (k=½)</text>
</svg>
