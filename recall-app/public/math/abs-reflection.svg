<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!-- Axes -->
  <line x1="20" y1="80" x2="180" y2="80" stroke="#374151" stroke-width="1.5"/>
  <line x1="100" y1="10" x2="100" y2="150" stroke="#374151" stroke-width="1.5"/>
  <!-- |x| dashed (opens up) -->
  <polyline points="40,140 100,80 160,140" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- -|x| reflected (opens down) -->
  <polyline points="40,20 100,80 160,20" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mirror line -->
  <line x1="30" y1="80" x2="170" y2="80" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Labels -->
  <text x="145" y="138" font-size="9" fill="#9ca3af" font-family="sans-serif">|x|</text>
  <text x="140" y="25" font-size="9" fill="#ef4444" font-family="sans-serif">-|x|</text>
  <text x="45" y="15" font-size="10" fill="#374151" font-weight="bold" font-family="sans-serif">Reflection (negative a)</text>
  <text x="35" y="75" font-size="8" fill="#fbbf24" font-family="sans-serif">x-axis mirror</text>
</svg>
