<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fff"/>
  <!-- Grid -->
  <g stroke="#e5e7eb" stroke-width="0.5">
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/><line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/><line x1="350" y1="0" x2="350" y2="300"/>
  </g>
  <!-- Axes -->
  <line x1="200" y1="0" x2="200" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="390" y="145" font-size="12" fill="#6b7280">x</text>
  <text x="205" y="12" font-size="12" fill="#6b7280">y</text>
  <!-- y-axis as mirror line -->
  <line x1="200" y1="0" x2="200" y2="300" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="205" y="25" font-size="10" fill="#ef4444" font-weight="bold">y-axis (mirror)</text>
  <!-- Original triangle (blue) - right side -->
  <polygon points="250,100 350,100 300,50" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="115" font-size="10" fill="#3b82f6">A(1,1)</text>
  <text x="352" y="115" font-size="10" fill="#3b82f6">B(3,1)</text>
  <text x="302" y="45" font-size="10" fill="#3b82f6">C(2,2)</text>
  <!-- Reflected triangle (purple) - left side -->
  <polygon points="150,100 50,100 100,50" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="2"/>
  <text x="130" y="115" font-size="10" fill="#9333ea">A'(-1,1)</text>
  <text x="20" y="115" font-size="10" fill="#9333ea">B'(-3,1)</text>
  <text x="72" y="45" font-size="10" fill="#9333ea">C'(-2,2)</text>
  <!-- Dashed connection lines -->
  <line x1="250" y1="100" x2="150" y2="100" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="350" y1="100" x2="50" y2="100" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="300" y1="50" x2="100" y2="50" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Labels -->
  <text x="200" y="285" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Reflection across y-axis</text>
  <text x="200" y="270" font-size="11" fill="#6b7280" text-anchor="middle">(x, y) → (-x, y)</text>
</svg>
