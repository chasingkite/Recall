<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!-- Grid -->
  <line x1="20" y1="130" x2="180" y2="130" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="10" x2="100" y2="150" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Axes -->
  <line x1="20" y1="90" x2="180" y2="90" stroke="#374151" stroke-width="1.5"/>
  <line x1="100" y1="10" x2="100" y2="150" stroke="#374151" stroke-width="1.5"/>
  <!-- V-shape: f(x) = |x| -->
  <polyline points="30,90 100,90 100,90" fill="none" stroke="#3b82f6" stroke-width="0" />
  <polyline points="40,150 100,90 160,150" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Labels -->
  <text x="162" y="148" font-size="10" fill="#3b82f6" font-family="sans-serif">f(x)=|x|</text>
  <text x="103" y="20" font-size="9" fill="#374151" font-family="sans-serif">y</text>
  <text x="172" y="86" font-size="9" fill="#374151" font-family="sans-serif">x</text>
  <!-- Vertex dot -->
  <circle cx="100" cy="90" r="3" fill="#3b82f6"/>
  <text x="104" y="102" font-size="8" fill="#6b7280" font-family="sans-serif">(0,0)</text>
</svg>
