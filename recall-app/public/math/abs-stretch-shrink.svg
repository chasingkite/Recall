<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!-- Axes -->
  <line x1="20" y1="80" x2="180" y2="80" stroke="#374151" stroke-width="1.5"/>
  <line x1="100" y1="10" x2="100" y2="150" stroke="#374151" stroke-width="1.5"/>
  <!-- |x| dashed (normal) -->
  <polyline points="40,140 100,80 160,140" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 2|x| narrower/steeper -->
  <polyline points="70,140 100,80 130,140" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- (1/2)|x| wider/flatter -->
  <polyline points="20,110 100,80 180,110" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Labels -->
  <text x="125" y="135" font-size="9" fill="#8b5cf6" font-family="sans-serif">2|x| narrow</text>
  <text x="135" y="108" font-size="9" fill="#f59e0b" font-family="sans-serif">½|x| wide</text>
  <text x="145" y="148" font-size="9" fill="#9ca3af" font-family="sans-serif">|x|</text>
  <text x="40" y="15" font-size="10" fill="#374151" font-weight="bold" font-family="sans-serif">Stretch &amp; Shrink (a)</text>
  <text x="30" y="30" font-size="8" fill="#6b7280" font-family="sans-serif">|a|&gt;1 = narrow, |a|&lt;1 = wide</text>
</svg>
