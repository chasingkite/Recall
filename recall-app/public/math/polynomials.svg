<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!-- Title -->
  <text x="30" y="15" font-size="10" fill="#374151" font-weight="bold" font-family="sans-serif">Polynomial Classification</text>
  <!-- Boxes -->
  <rect x="10" y="30" width="55" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="72" y="30" width="55" height="50" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <rect x="134" y="30" width="55" height="50" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="18" y="50" font-size="9" fill="#3b82f6" font-weight="bold" font-family="sans-serif">Monomial</text>
  <text x="20" y="63" font-size="8" fill="#374151" font-family="sans-serif">1 term</text>
  <text x="22" y="75" font-size="9" fill="#6b7280" font-family="monospace">5x²</text>
  <text x="82" y="50" font-size="9" fill="#10b981" font-weight="bold" font-family="sans-serif">Binomial</text>
  <text x="84" y="63" font-size="8" fill="#374151" font-family="sans-serif">2 terms</text>
  <text x="80" y="75" font-size="9" fill="#6b7280" font-family="monospace">5x + 2</text>
  <text x="140" y="50" font-size="9" fill="#a855f7" font-weight="bold" font-family="sans-serif">Trinomial</text>
  <text x="142" y="63" font-size="8" fill="#374151" font-family="sans-serif">3 terms</text>
  <text x="136" y="75" font-size="9" fill="#6b7280" font-family="monospace">x²+5x+2</text>
  <!-- Degree example -->
  <rect x="10" y="95" width="180" height="55" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="20" y="112" font-size="9" fill="#374151" font-weight="bold" font-family="sans-serif">Standard Form (decreasing degree):</text>
  <text x="30" y="130" font-size="11" fill="#374151" font-family="monospace">-x³ + 15x + 3</text>
  <text x="30" y="143" font-size="8" fill="#6b7280" font-family="sans-serif">degree=3, leading coeff=-1</text>
</svg>
