<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!-- Axes -->
  <line x1="20" y1="90" x2="180" y2="90" stroke="#374151" stroke-width="1.5"/>
  <line x1="100" y1="10" x2="100" y2="150" stroke="#374151" stroke-width="1.5"/>
  <!-- |x| dashed -->
  <polyline points="40,150 100,90 160,150" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- |x| + 3 shifted up -->
  <polyline points="40,120 100,60 160,120" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrow showing vertical shift -->
  <line x1="97" y1="87" x2="97" y2="63" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arru)"/>
  <defs><marker id="arru" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 10 L 5 0 L 10 10 z" fill="#ef4444"/></marker></defs>
  <text x="80" y="78" font-size="8" fill="#ef4444" font-family="sans-serif">k=+3 ↑</text>
  <!-- Labels -->
  <text x="30" y="148" font-size="9" fill="#9ca3af" font-family="sans-serif">|x|</text>
  <text x="140" y="55" font-size="9" fill="#10b981" font-family="sans-serif">|x| + 3</text>
  <text x="60" y="15" font-size="10" fill="#374151" font-weight="bold" font-family="sans-serif">Vertical Shift (k)</text>
</svg>
