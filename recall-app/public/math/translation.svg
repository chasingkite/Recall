<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fff"/>
  <!-- Grid -->
  <g stroke="#e5e7eb" stroke-width="0.5">
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/><line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/><line x1="350" y1="0" x2="350" y2="300"/>
  </g>
  <!-- Axes -->
  <line x1="200" y1="0" x2="200" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="390" y="145" font-size="12" fill="#6b7280">x</text>
  <text x="205" y="12" font-size="12" fill="#6b7280">y</text>
  <!-- Original triangle (blue) -->
  <polygon points="250,100 350,100 350,50" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="2"/>
  <text x="235" y="95" font-size="10" fill="#3b82f6">A(1,1)</text>
  <text x="352" y="95" font-size="10" fill="#3b82f6">B(3,1)</text>
  <text x="352" y="45" font-size="10" fill="#3b82f6">C(3,2)</text>
  <!-- Arrow showing translation -->
  <line x1="300" y1="75" x2="200" y2="175" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f97316"/>
    </marker>
  </defs>
  <!-- Translated triangle (green) -->
  <polygon points="150,200 250,200 250,150" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="215" font-size="10" fill="#16a34a">A'(-1,-1)</text>
  <text x="252" y="215" font-size="10" fill="#16a34a">B'(1,-1)</text>
  <text x="252" y="145" font-size="10" fill="#16a34a">C'(1,0)</text>
  <!-- Translation vector label -->
  <text x="270" y="140" font-size="11" fill="#f97316" font-weight="bold">(-2, -2)</text>
  <!-- Labels -->
  <text x="200" y="285" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Translation: slide every point the same distance</text>
  <text x="200" y="270" font-size="11" fill="#6b7280" text-anchor="middle">(x, y) → (x - 2, y - 2)</text>
  <!-- Legend -->
  <rect x="10" y="10" width="12" height="12" fill="#3b82f6" rx="2"/>
  <text x="26" y="20" font-size="10" fill="#3b82f6">Original</text>
  <rect x="10" y="26" width="12" height="12" fill="#22c55e" rx="2"/>
  <text x="26" y="36" font-size="10" fill="#16a34a">Translated</text>
</svg>
